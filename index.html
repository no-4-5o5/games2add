<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 { margin: 20px; }

.menu { margin-bottom: 10px; }

button {
    padding: 12px 18px;
    margin: 8px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #1e90ff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0f6cd1;
}

#gameFrame {
    width: 100%;
    height: 85vh;
    border: none;
    background: black;
    display: none;
}

#gameContainer {
    width: 100%;
    height: 85vh;
    display: none;
}
</style>
</head>
<body>

<h1>My Game Hub</h1>

<div class="menu">
    <button onclick="loadGame('WHG3.swf')">WHG 3</button>
    <button onclick="loadGame('WHG2.swf')">WHG 2</button>
    <button onclick="loadGame('Snore.swf')">Snoring</button>
    <button onclick="loadGame('WEG.swf')">WEG</button>
    <button onclick="loadGame('WHG4.swf')">WHG 4</button>
    <button onclick="loadGame('SLIMELAB.swf')">Slime Lab</button>
    <button onclick="loadGame('PT/index.html')">PolyTrack</button>
    <button onclick="loadGame('yohoho/index.html')">yohoho</button>
    <button onclick="loadGame('rowdycitywrestling/index.html')">RCW</button>
    <button onclick="loadGame('GW/index.html')">GeoWaves</button>
    <button onclick="loadGame('SWING/index.html')">Swingers</button>
</div>

<iframe id="gameFrame"></iframe>
<div id="gameContainer"></div>

<script>
function loadGame(file) {
    const ext = file.split('.').pop().toLowerCase();

    const iframe = document.getElementById("gameFrame");
    const container = document.getElementById("gameContainer");

    // reset both
    iframe.style.display = "none";
    iframe.src = "";
    container.style.display = "none";
    container.innerHTML = "";

    if (ext === "swf") {
        // Ruffle player
        container.style.display = "block";

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";

        container.appendChild(player);
        player.load(file);

    } else {
        // normal HTML game
        iframe.style.display = "block";
        iframe.src = file;
    }
}
</script>

</body>
</html>
